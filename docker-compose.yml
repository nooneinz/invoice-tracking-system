services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: invoices
      POSTGRES_USER: invoices
      POSTGRES_PASSWORD: ${DB_PASSWORD:?ضع DB_PASSWORD في .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoices"]
      interval: 5s
      retries: 10
  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://invoices:${DB_PASSWORD}@db:5432/invoices
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@company.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ضع ADMIN_PASSWORD في .env}
      JWT_SECRET: ${JWT_SECRET:?ضع JWT_SECRET في .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
    ports: ["8000:8000"]
volumes:
  pgdata:
